[package]
name = "pido"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Desktop client for the Pi coding agent, built with GPUI and Ely components."
license = "MIT"
publish.workspace = true

[[bin]]
name = "pido"
path = "src/main.rs"

[dependencies]
pi-rpc.workspace = true
ely-gpui-component.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger.workspace = true

# Linux needs the wayland and x11 backends enabled explicitly.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }
