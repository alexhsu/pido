name: Release

# A version tag builds all three platforms and publishes a GitHub Release
# with the packaged artifacts. Requires `pido.desktop` in the repo root and
# `crates/pido/assets/pido-mark-512.png` (the icon source).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-aarch64
          - os: ubuntu-latest
            target: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libegl1-mesa-dev
          for pkg in libfontconfig1-dev libfontconfig-dev; do
            sudo apt-get install -y "$pkg" && break
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p pido

      - name: Read version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # --- Windows: the exe carries its icon; zip it with the license.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/pido-${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/pido.exe $stage/
          Copy-Item LICENSE $stage/
          Compress-Archive -Path $stage -DestinationPath `
            "pido-${{ steps.version.outputs.version }}-windows-x64.zip"

      # --- macOS: a real .app bundle with an icns built from the mark.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="stage/pido-${VERSION}-macos-aarch64/pido.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/pido "$APP/Contents/MacOS/"
          cp LICENSE "$APP/Contents/"

          # The icon set needs every size, plus the @2x pairs.
          mkdir -p pido.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size crates/pido/assets/pido-mark-512.png \
              --out "pido.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double crates/pido/assets/pido-mark-512.png \
              --out "pido.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns pido.iconset \
            --output "$APP/Contents/Resources/pido.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>pido</string>
            <key>CFBundleIconFile</key><string>pido</string>
            <key>CFBundleIdentifier</key><string>dev.alexhsu.pido</string>
            <key>CFBundleName</key><string>pido</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
          </dict>
          </plist>
          PLIST

          cd stage
          zip -qry "pido-${VERSION}-macos-aarch64.zip" \
            "pido-${VERSION}-macos-aarch64"
          cd ..

      # --- Linux: an AppImage with a desktop entry and the icon.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="stage/pido-${VERSION}-linux-x64.AppDir"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/256x256/apps"
          cp target/release/pido "$STAGE/usr/bin/"
          cp pido.desktop "$STAGE/usr/share/applications/"
          cp crates/pido/assets/pido-mark-512.png "$STAGE/pido.png"
          cp crates/pido/assets/pido-mark-512.png "$STAGE/usr/share/icons/hicolor/256x256/apps/pido.png"
          cp LICENSE "$STAGE/"
          cp pido.desktop "$STAGE/usr/share/applications/"
          cp crates/pido/assets/pido-mark-512.png "$STAGE/pido.png"
          cp crates/pido/assets/pido-mark-512.png \n            "$STAGE/usr/share/icons/hicolor/256x256/apps/pido.png"
          cp LICENSE "$STAGE/"

          curl -fsSL -o linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy
          # Extract-and-run: FUSE is not available on the runners.
          APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1 ./linuxdeploy --appdir "$STAGE" --output appimage
          ls -la *.AppImage

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows-x64) mv pido-*windows-x64.zip dist/ ;;
            macos-aarch64) mv stage/*.zip dist/ ;;
            linux-x64) mv *.AppImage dist/ ;;
          esac
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pido-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: pido ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
